# ──────────────────────────────────────────────
# ROUTER CONFIGURATION
# Smart routing rules for VIC agents
# ──────────────────────────────────────────────

router_settings:
  routing_strategy: "usage-based-routing-v2"
  enable_pre_call_check: true
  num_retries: 3
  timeout: 120
  retry_after: 5

  # Fallback chains for reliability
#  fallbacks:
#    - model_name: gpt-5
#      fallback_models: [claude-opus-4, gemini-2.5-pro, deepseek-v3]
#    - model_name: claude-opus-4
#      fallback_models: [gpt-5, gemini-2.5-pro, claude-sonnet-4]
#    - model_name: deepseek-r1
#      fallback_models: [deepseek-v3, skywork-or1-32b, gpt-5-minimal]

  # VMOA agent-to-model routing
  # Each VIC agent gets optimal model assignment
  model_group_alias:
    "vmoa-dispatcher": "gpt-5"
    "vmoa-synthesizer": "claude-opus-4"
    "vmoa-validator": "skywork-reward-v2-8b"
    "vmoa-narrator": "gemini-2.5-flash"
    "vmoa-researcher": "genspark-research-v1"
    "vmoa-mathematician": "skywork-or1-32b"
    "vmoa-vision": "genspark-vision-v1"
    "vmoa-china-ops": "deepseek-v3"
    "vic-reasoner": "o3-pro"
    "vic-coder": "gpt-5"
    "opc-default": "gpt-5-minimal"

# ──────────────────────────────────────────────
# GRPO REWARD CONFIGURATION
# Points VIC Engine to Skywork-Reward-V2
# ──────────────────────────────────────────────

grpo_reward_config:
  primary_reward_model: "skywork-reward-v2-8b"
  reward_endpoint: "http://reward-server:8000/classify"
  hf_model_id: "Skywork/Skywork-Reward-V2-Llama-3.1-8B-40M"
  benchmark_score: 88.6  # Average across 7 benchmarks
  rewardbench_v1: 97.8
  rewardbench_v2: 86.5
  prm_endpoint: "http://prm-server:8081/v1"
  prm_model: "Skywork/Skywork-o1-Open-PRM-Qwen-2.5-7B"
  step_scoring: true  # Enable per-step PRM scoring for VIC Pillar 3

# ──────────────────────────────────────────────
# ENVIRONMENT VARIABLES REFERENCE
# Set in .env file or docker-compose environment
# ──────────────────────────────────────────────
# GENSPARK2API_SECRET=your_genspark2api_api_secret
# SKYWORK_API_KEY=your_skywork_platform_key (request: peter@skywork.ai)
# OPENAI_API_KEY=sk-...  (fallback)
# ANTHROPIC_API_KEY=...  (fallback)
# GOOGLE_API_KEY=...     (fallback)

