  - model_name: skywork-prm
    litellm_params:
      model: openai/prm-model
      api_base: http://prm-server:8081/v1
      api_key: EMPTY
    model_info:
      provider: skywork-prm
      use_case: Step-level reasoning verification for VIC Pillar 3
      note: Used by 7-step reasoning protocol for per-step scoring

