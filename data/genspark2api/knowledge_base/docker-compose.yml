# ============================================================
# iVenture Studio — Docker Compose (Phase 27 Full Stack)
# Version: 2.0 — Skywork + OpenManus Integration
# Updated: 2026-03-17
# Usage: docker compose up -d
# ============================================================

version: '3.8'

networks:
  iventure-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  redis_data:
  memory_data:
  skills_data:
  reward_model_cache:
  prm_model_cache:
  vllm_or1_cache:

services:

  # ────────────────────────────────────────────────
  # CORE INFRASTRUCTURE
  # ────────────────────────────────────────────────

  traefik:
    image: traefik:v3.0
    container_name: iventure-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"   # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - iventure-net

  postgres:
    image: timescale/timescaledb-ha:pg16
    container_name: iventure-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: iventure_studio
      POSTGRES_USER: iventure
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - iventure-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iventure -d iventure_studio"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: iventure-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - iventure-net

  # ────────────────────────────────────────────────
  # MODEL GATEWAY LAYER
  # ────────────────────────────────────────────────

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: iventure-litellm
    restart: unless-stopped
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    environment:
      - GENSPARK2API_SECRET=${GENSPARK2API_SECRET}
      - SKYWORK_API_KEY=${SKYWORK_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DATABASE_URL=postgresql://iventure:${POSTGRES_PASSWORD}@postgres:5432/iventure_studio
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iventure-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.litellm.rule=Host(`litellm.localhost`)"
      - "traefik.http.services.litellm.loadbalancer.server.port=4000"

  # ────────────────────────────────────────────────
  # GENSPARK2API — 30+ Model Gateway
  # Provides: GPT-5, Claude-opus-4, Gemini-2.5-pro,
  #           DeepSeek-R1, Grok-4, Sora-2, VEO3 + more
  # ────────────────────────────────────────────────

  genspark2api:
    image: deanxv/genspark2api:latest
    container_name: iventure-genspark2api
    restart: always
    ports:
      - "7055:7055"
    volumes:
      - ./data/genspark2api:/app/genspark2api/data
    environment:
      - GS_COOKIE=${GENSPARK_COOKIE}
      - API_SECRET=${GENSPARK2API_SECRET}
      - TZ=Atlantic/Reykjavik
    networks:
      - iventure-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.genspark2api.rule=Host(`models.localhost`)"
      - "traefik.http.services.genspark2api.loadbalancer.server.port=7055"

  # ────────────────────────────────────────────────
  # VIC ENGINE V5 — Core Intelligence API
  # Phase 27 | GRPO 0.991337 | MCP Live
  # ────────────────────────────────────────────────

  vic-engine:
    build:
      context: ./vic_engine_v5
      dockerfile: Dockerfile
    container_name: iventure-vic-engine
    restart: unless-stopped
    environment:
      - LITELLM_API_BASE=http://litellm:4000
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY}
      - POSTGRES_URL=postgresql://iventure:${POSTGRES_PASSWORD}@postgres:5432/iventure_studio
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - REWARD_SERVER_URL=http://reward-server:8000
      - PRM_SERVER_URL=http://prm-server:8081
      - MEMORY_PATH=/app/memory
      - SKILLS_PATH=/app/skills
      - VIC_VERSION=v4.2
      - PHASE=27
      - GRPO_TARGET=0.9913
    volumes:
      - memory_data:/app/memory
      - skills_data:/app/skills
    depends_on:
      - litellm
      - postgres
      - reward-server
    networks:
      - iventure-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vic-engine.rule=Host(`api.localhost`)"
      - "traefik.http.services.vic-engine.loadbalancer.server.port=8000"

  # ────────────────────────────────────────────────
  # VMOA — Venture Master Orchestrator Agent
  # 11 specialized VIC agents in ensemble
  # ────────────────────────────────────────────────

  vmoa:
    build:
      context: ./vmoa
      dockerfile: Dockerfile
    container_name: iventure-vmoa
    restart: unless-stopped
    environment:
      - VIC_ENGINE_URL=http://vic-engine:8000
      - LITELLM_API_BASE=http://litellm:4000
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY}
      - SKYWORK_API_KEY=${SKYWORK_API_KEY}
      - GRPO_TARGET_ENSEMBLE=0.95
      - AGENT_COUNT=11
    depends_on:
      - vic-engine
      - litellm
    networks:
      - iventure-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vmoa.rule=Host(`vmoa.localhost`)"
      - "traefik.http.services.vmoa.loadbalancer.server.port=8001"

  # ────────────────────────────────────────────────
  # OPENMANUS — Agent Execution Framework
  # MIT License | MetaGPT Team | UIUC GRPO-RL
  # Modes: single / MCP / multi-agent flow
  # ────────────────────────────────────────────────

  openmanus:
    image: python:3.12-slim
    container_name: iventure-openmanus
    restart: unless-stopped
    working_dir: /app
    command: >
      bash -c "
        pip install uv -q &&
        git clone https://github.com/FoundationAgents/OpenManus.git . &&
        uv venv && uv pip install -r requirements.txt -q &&
        playwright install chromium &&
        python run_mcp.py
      "
    environment:
      - LITELLM_BASE_URL=http://litellm:4000/v1
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY}
      - MODEL=gpt-5
      - USE_DATA_ANALYSIS_AGENT=true
    networks:
      - iventure-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openmanus.rule=Host(`agent.localhost`)"
      - "traefik.http.services.openmanus.loadbalancer.server.port=8002"

  # ────────────────────────────────────────────────
  # SKYWORK-SUPER-AGENTS MCP — Office Document Tools
  # Generates: PPT, docs, spreadsheets, webpages, broadcasts
  # ────────────────────────────────────────────────

  skywork-super-agents:
    image: python:3.12-slim
    container_name: iventure-skywork-office
    restart: unless-stopped
    working_dir: /app
    command: >
      bash -c "
        pip install uv -q &&
        pip install 'git+https://github.com/Skywork-ai/Skywork-Super-Agents.git' -q &&
        uvx --from git+https://github.com/Skywork-ai/Skywork-Super-Agents.git office-tool
      "
    environment:
      - SKYWORK_API_KEY=${SKYWORK_API_KEY}
    networks:
      - iventure-net

  # ────────────────────────────────────────────────
  # SKYWORK-REWARD-V2 — GRPO Reward Signal Server
  # Model: Skywork-Reward-V2-Llama-3.1-8B-40M
  # RewardBench v1: 97.8 (SOTA — beats all models)
  # ────────────────────────────────────────────────

  reward-server:
    image: python:3.12-slim
    container_name: iventure-reward-server
    restart: unless-stopped
    working_dir: /app
    command: >
      bash -c "
        pip install sglang transformers torch -q &&
        python -m sglang.launch_server \
          --model-path Skywork/Skywork-Reward-V2-Llama-3.1-8B-40M \
          --mem-fraction-static 0.9 \
          --tp 1 \
          --host 0.0.0.0 \
          --port 8000 \
          --context-length 16384 \
          --is-embedding
      "
    volumes:
      - reward_model_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - iventure-net

  # ────────────────────────────────────────────────
  # SKYWORK-O1-PRM — Step-Level Process Reward Model
  # Per-step reasoning verification for VIC Pillar 3
  # ────────────────────────────────────────────────

  prm-server:
    image: python:3.12-slim
    container_name: iventure-prm-server
    restart: unless-stopped
    working_dir: /app
    command: >
      bash -c "
        pip install vllm==v0.6.4.post1 -q &&
        git clone https://github.com/SkyworkAI/skywork-o1-prm-inference.git . &&
        pip install -e . -q &&
        vllm serve Skywork/Skywork-o1-Open-PRM-Qwen-2.5-7B \
          --host 0.0.0.0 \
          --port 8081 \
          --tensor-parallel-size 1 \
          --gpu-memory-utilization 0.85
      "
    volumes:
      - prm_model_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - CUDA_VISIBLE_DEVICES=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - iventure-net

  # ────────────────────────────────────────────────
  # SKYWORK-OR1-32B — Math/Code Reasoning Agent
  # VMOA Agent #10 | AIME24: 82.2 (beats DeepSeek-R1)
  # Self-hosted via vLLM — deploy on atNorth Iceland
  # ────────────────────────────────────────────────

  vllm-or1:
    image: vllm/vllm-openai:latest
    container_name: iventure-vllm-or1
    restart: unless-stopped
    command: >
      --model Skywork/Skywork-OR1-32B
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size 4
      --gpu-memory-utilization 0.90
      --max-model-len 32768
    volumes:
      - vllm_or1_cache:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - CUDA_VISIBLE_DEVICES=2,3,4,5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 4
              capabilities: [gpu]
    networks:
      - iventure-net
    profiles:
      - gpu-full   # Only start with: docker compose --profile gpu-full up

  # ────────────────────────────────────────────────
  # STUDIO FRONTEND — IntelliAgent Pro Dashboard
  # Agent Builder, Skills Creator, OPC Templates
  # ────────────────────────────────────────────────

  studio-frontend:
    image: nginx:alpine
    container_name: iventure-studio
    restart: unless-stopped
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - iventure-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.studio.rule=Host(`studio.localhost`)"
      - "traefik.http.services.studio.loadbalancer.server.port=80"

  # ────────────────────────────────────────────────
  # TESSLATE STUDIO — Code Execution + Deployment
  # GitHub: TesslateAI/Studio | Apache 2.0
  # ────────────────────────────────────────────────

  tesslate-backend:
    image: tesslate/studio-backend:latest
    container_name: iventure-tesslate
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://iventure:${POSTGRES_PASSWORD}@postgres:5432/iventure_studio
      - LITELLM_API_BASE=http://litellm:4000
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iventure-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tesslate.rule=Host(`build.localhost`)"
      - "traefik.http.services.tesslate.loadbalancer.server.port=8000"

# ────────────────────────────────────────────────
# QUICK START URLS (after docker compose up -d)
# ────────────────────────────────────────────────
# http://studio.localhost      → Agent Builder Studio (main UI)
# http://api.localhost         → VIC Engine v5 API
# http://vmoa.localhost        → VMOA Orchestrator
# http://agent.localhost       → OpenManus execution
# http://models.localhost      → genspark2api model list
# http://litellm.localhost     → LiteLLM gateway
# http://build.localhost       → Tesslate Studio
# http://localhost:8080        → Traefik dashboard

